<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="480" fill="#ffffff"/>

  <!-- Build group -->
  <rect x="20" y="20" width="560" height="180" rx="12" fill="#f5f7fa" stroke="#c7cdd6" stroke-width="1.5"/>
  <text x="40" y="48" font-size="16" font-weight="700" fill="#2b3440">Build</text>

  <rect x="40" y="70" width="150" height="70" rx="8" fill="#eef2ff" stroke="#7c8bd8" stroke-width="1.5"/>
  <text x="115" y="100" font-size="14" fill="#2b3440" text-anchor="middle" font-weight="600">train.py</text>
  <text x="115" y="119" font-size="11.5" fill="#5b6472" text-anchor="middle">trains RandomForest</text>

  <rect x="230" y="70" width="150" height="70" rx="8" fill="#eef2ff" stroke="#7c8bd8" stroke-width="1.5"/>
  <text x="305" y="100" font-size="14" fill="#2b3440" text-anchor="middle" font-weight="600">model.joblib</text>
  <text x="305" y="119" font-size="11.5" fill="#5b6472" text-anchor="middle">serialized model</text>

  <rect x="420" y="70" width="150" height="70" rx="8" fill="#eef2ff" stroke="#7c8bd8" stroke-width="1.5"/>
  <text x="495" y="97" font-size="14" fill="#2b3440" text-anchor="middle" font-weight="600">app.py</text>
  <text x="495" y="114" font-size="11.5" fill="#5b6472" text-anchor="middle">
    <tspan x="495" dy="0">FastAPI</tspan>
    <tspan x="495" dy="15">+ Uvicorn</tspan>
  </text>

  <!-- docker image box spans under app.py -->
  <rect x="420" y="155" width="150" height="45" rx="8" fill="#fff4e5" stroke="#d99a3d" stroke-width="1.5"/>
  <text x="495" y="173" font-size="12.5" fill="#2b3440" text-anchor="middle" font-weight="600">Docker image</text>
  <text x="495" y="188" font-size="11.5" fill="#5b6472" text-anchor="middle">ml-demo:v1</text>

  <path d="M190,105 H230" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M380,105 H420" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M495,140 V155" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- Cluster group -->
  <rect x="620" y="20" width="520" height="340" rx="12" fill="#f5f7fa" stroke="#c7cdd6" stroke-width="1.5"/>
  <text x="640" y="48" font-size="16" font-weight="700" fill="#2b3440">Kubernetes Cluster (kind)</text>

  <!-- Service -->
  <rect x="770" y="70" width="220" height="60" rx="8" fill="#e8f6ee" stroke="#4caf7d" stroke-width="1.5"/>
  <text x="880" y="94" font-size="13.5" fill="#2b3440" text-anchor="middle" font-weight="600">Service: ml-demo (ClusterIP)</text>
  <text x="880" y="112" font-size="11.5" fill="#5b6472" text-anchor="middle">port 80 → targetPort 8000</text>

  <!-- Deployment group -->
  <rect x="650" y="160" width="460" height="170" rx="10" fill="#ffffff" stroke="#9aa4b2" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="670" y="184" font-size="13" font-weight="700" fill="#2b3440">Deployment: ml-demo (2 replicas)</text>

  <rect x="670" y="200" width="200" height="105" rx="8" fill="#eef2ff" stroke="#7c8bd8" stroke-width="1.5"/>
  <text x="770" y="222" font-size="13" fill="#2b3440" text-anchor="middle" font-weight="600">Pod 1</text>
  <text x="770" y="240" font-size="11" fill="#5b6472" text-anchor="middle">GET /healthz readiness</text>
  <text x="770" y="256" font-size="11" fill="#5b6472" text-anchor="middle">requests: 100m / 128Mi</text>
  <text x="770" y="272" font-size="11" fill="#5b6472" text-anchor="middle">limits: 500m / 256Mi</text>
  <text x="770" y="292" font-size="11" fill="#5b6472" text-anchor="middle">container port 8000</text>

  <rect x="890" y="200" width="200" height="105" rx="8" fill="#eef2ff" stroke="#7c8bd8" stroke-width="1.5"/>
  <text x="990" y="222" font-size="13" fill="#2b3440" text-anchor="middle" font-weight="600">Pod 2</text>
  <text x="990" y="240" font-size="11" fill="#5b6472" text-anchor="middle">GET /healthz readiness</text>
  <text x="990" y="256" font-size="11" fill="#5b6472" text-anchor="middle">requests: 100m / 128Mi</text>
  <text x="990" y="272" font-size="11" fill="#5b6472" text-anchor="middle">limits: 500m / 256Mi</text>
  <text x="990" y="292" font-size="11" fill="#5b6472" text-anchor="middle">container port 8000</text>

  <path d="M850,130 L790,200" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M910,130 L980,200" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <!-- image loaded into cluster -->
  <path d="M570,178 C 640,178 600,100 765,100" stroke="#d99a3d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)" fill="none"/>
  <rect x="575" y="192" width="150" height="18" fill="#ffffff" opacity="0.85"/>
  <text x="650" y="205" font-size="10.5" fill="#8a6a2f" text-anchor="middle">kind load docker-image</text>

  <!-- Client -->
  <rect x="20" y="260" width="180" height="70" rx="8" fill="#fdeef0" stroke="#d97390" stroke-width="1.5"/>
  <text x="110" y="290" font-size="13.5" fill="#2b3440" text-anchor="middle" font-weight="600">Client</text>
  <text x="110" y="308" font-size="11" fill="#5b6472" text-anchor="middle">curl / port-forward</text>

  <path d="M200,295 C 400,295 550,110 770,100" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <text x="20" y="450" font-size="12" fill="#8a93a1">Model training and serving pipeline, containerized and deployed to Kubernetes with health checks and resource limits.</text>
</svg>
